### stairLedLight main
substitutions:
  devicename: stairledlight
  domainName: .example.local
  upperDevicename: stair Led Light
  maxBright: "70"       # maximum brightness for the leds to reach (in %)
  nightBright: "25"     # brightness for always-on during night
  transLenghtOn: "1.5"  # time for transition from Off to On
  delayLenghtOn: "0.2" # delay between turining on the next step
  transLenghtOff: "4"   # time for tranistion from On to Off
  delayLenghtOff: "0.5" # delay between turning off the next step
  stayOn: "256"        # duration of time the lights stay on after all lights are turned on
  nightTransLength: "40" # transition length for fading to night brightness

esphome:
  name: $devicename
  on_boot:
    - priority: 1000
      then:
        - logger.set_level: WARN

esp32:
  board: esp32-poe
  framework:
    type: esp-idf
    # version: latest
    advanced:
      minimum_chip_revision: "3.0"

packages:
  # wifi: !include common/wifi.yml
  ethernet: !include common/ethernet.yml
  api: !include common/api.yml
  ota: !include common/ota.yml
  # mqtt: !include common/mqtt.yml
  logger: !include common/logger.yml
  sun: !include common/sun.yml
  time: !include common/time.yml
  web_server: !include common/webserver.yml

external_components:
  - source: github://muxa/esphome-state-machine@main
    components: [state_machine]

i2c:
  scan: True

# load module for PCA9685 16-Channel 12-bit PWM/Servo Driver I2C
# datasheet https://www.nxp.com/docs/en/data-sheet/PCA9685.pdf
pca9685:
  - frequency: 1000

#Define PCA9685 PWM chnnels and register them as outputs in ESPHome
# pins 0-15 are defined as channel 0-15
output:
  - platform: pca9685
    id: pca1_0
    channel: 15
    inverted: False

  - platform: pca9685
    id: pca1_1
    channel: 14
    inverted: False

  - platform: pca9685
    id: pca1_2
    channel: 13
    inverted: False

  - platform: pca9685
    id: pca1_3
    channel: 12
    inverted: False

  - platform: pca9685
    id: pca1_4
    channel: 11
    inverted: False

  - platform: pca9685
    id: pca1_5
    channel: 10
    inverted: False

  - platform: pca9685
    id: pca1_6
    channel: 9
    inverted: False

  - platform: pca9685
    id: pca1_7
    channel: 8
    inverted: False

  - platform: pca9685
    id: pca1_8
    channel: 7
    inverted: False

  - platform: pca9685
    id: pca1_9
    channel: 6
    inverted: False

  - platform: pca9685
    id: pca1_10
    channel: 5
    inverted: False

  - platform: pca9685
    id: pca1_11
    channel: 4
    inverted: False

  - platform: pca9685
    id: pca1_12
    channel: 3
    inverted: False

  - platform: pca9685
    id: pca1_13
    channel: 2
    inverted: False

  - platform: pca9685
    id: pca1_14
    channel: 1
    inverted: False

  - platform: pca9685
    id: pca1_15
    channel: 0
    inverted: False

