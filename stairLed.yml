button:
  # restart the controller from HA button  
  - platform: restart
    name: $upperDevicename Restart

  # Trigger bottom-top fade on
  - platform: template
    name: fadeOnBottomTop
    on_press:
      then:
        - script.execute: fadeOnBottomTop

  # Trigger bottom-top fade off
  - platform: template
    name: fadeOffBootomTop
    on_press:
      then:
        - script.execute: fadeOffBootomTop

# Trigger top-bottom fade on
  - platform: template
    name: fadeOnTopBottom
    on_press:
      then:
        - script.execute: fadeOnTopBottom

# Trigger top-bottom fade off
  - platform: template
    name: fadeOffTopBootom
    on_press:
      then:
        - script.execute: fadeOffTopBootom

# Trigger nightMode
  - platform: template
    name: nightMode
    on_press:
      - script.execute: nightMode

binary_sensor:
  - platform: template
    name: ledOn
    id: ledOn
    internal: True

# switch:
  - platform: gpio
    name: bottomPir
    pin: 
      number: 36
      mode: 
        input: true
        # pulldown: true
    device_class: motion
    filters:
      - delayed_off: 10s
    on_press:
      then:
        # - if:
        #     condition:
        #       - light.is_off: step2
        #     then:
              - script.stop: fadeOnTopBottom
              - script.stop: fadeOffTopBootom
              - script.execute: fadeOnBottomTop
              - script.wait: fadeOnBottomTop
              - script.execute: fadeOffBootomTop

  - platform: gpio
    name: topPir
    pin: 
      number: 14
      mode: 
        input: true
        pulldown: true
    device_class: motion
    filters:
      - delayed_off: 10s
    on_press:
      then:
        # - if:
        #     condition:
        #       - light.is_off: step15
        #     then:
              - script.stop: fadeOnBottomTop
              - script.stop: fadeOffBootomTop
              - script.execute: fadeOnTopBottom
              - script.wait: fadeOnTopBottom
              - script.execute: fadeOffTopBootom

# Temp sensor
sensor:
  - platform: bmp085
    temperature:
      name: "$upperDevicename enclosure Temperature"
    pressure:
      name: "$upperDevicename enclosure Pressure"
    update_interval: 300s