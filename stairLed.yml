        transition_length: ${transLenghtOff}s
    - delay: ${delayLenghtOff}s
    - light.turn_off:
        id: step13
        transition_length: ${transLenghtOff}s
    - delay: ${delayLenghtOff}s
    - light.turn_off:
        id: step12
        transition_length: ${transLenghtOff}s
    - delay: ${delayLenghtOff}s
    - light.turn_off:
        id: step11
        transition_length: ${transLenghtOff}s
    - delay: ${delayLenghtOff}s
    - light.turn_off:
