button:
  # restart the controller from HA button  
  - platform: restart
    name: $upperDevicename Restart

  # Trigger bottom-top fade on
  - platform: template
    name: fadeOnBottomTop
    on_press:
      then:
        - script.execute: fadeOnBottomTop

  # Trigger bottom-top fade off
  - platform: template
    name: fadeOffBottomTop
    on_press:
      then:
        - script.execute: fadeOffBottomTop

# Trigger top-bottom fade on
  - platform: template
    name: fadeOnTopBottom
    on_press:
      then:
        - script.execute: fadeOnTopBottom

# Trigger top-bottom fade off
  - platform: template
    name: fadeOffTopBottom
    on_press:
      then:
        - script.execute: fadeOffTopBottom

# Trigger nightMode
  - platform: template
    name: nightMode
    on_press:
      - script.execute: nightMode

# stop all scripts
  - platform: template
    name: stopAllScripts
    id: stopAllScripts
    on_press:
      - script.execute: stopAll

# Trigger halloween mode  
  - platform: template
    name: halloween
    on_press:
      - script.execute: halloween

binary_sensor:
  - platform: gpio
    name: bottomPir
    pin: 
      number: 36
      mode: 
        input: true
        # pulldown: true
    device_class: motion
    filters:
      - delayed_off: 10s
    on_press:
      - state_machine.transition: pirBottomDetected

  - platform: gpio
    name: topPir
    pin: 
      number: 14
      mode: 
        input: true
        pulldown: true
    device_class: motion
    filters:
      - delayed_off: 10s
    on_press:
      - state_machine.transition: pirTopDetected

## define state machine
state_machine:
  - id: staircaseStateMachine
    name: "Staircase Lights"
    initial_state: unOccupied
    states:
      - name: unOccupied
        on_enter:
          - logger.log: "Entering unOccupied state. Lights are off."
      - name: occupiedBottom
        on_enter:
          - logger.log: "Entering occupiedBottom state."
          - script.execute: fadeOnBottomTop
          - script.execute: timerScript
        on_leave:
          - logger.log: "Exiting occupiedBottom state."
          - script.stop: fadeOnBottomTop
          - script.stop: timerScript
          - script.execute: fadeOffBottomTop
      - name: occupiedTop
        on_enter:
          - logger.log: "Entering occupiedTop state."
          - script.execute: fadeOnTopBottom
          - script.execute: timerScript
        on_leave:
          - logger.log: "Exiting occupiedTop state."
          - script.stop: fadeOnTopBottom
          - script.stop: timerScript
          - script.execute: fadeOffTopBottom
    inputs:
      - name: pirBottomDetected
        transitions:
          - unOccupied -> occupiedBottom
          - occupiedTop -> unOccupied
      - name: pirTopDetected
        transitions:
          - unOccupied -> occupiedTop
          - occupiedBottom -> unOccupied
      - name: idleTimeout
        transitions:
          - occupiedTop -> unOccupied
          - occupiedBottom -> unOccupied

text_sensor:
  - platform: state_machine
    name: "Staircase State"

# Temperature sensor
sensor:
  - platform: bmp085
    temperature:
      name: "$upperDevicename enclosure Temperature"
    pressure:
      name: "$upperDevicename enclosure Pressure"
    update_interval: 300s

  - platform: internal_temperature
    name: "ESP32-POE Internal Temperature"
    update_interval: 60s
