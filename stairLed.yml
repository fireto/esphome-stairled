        id: step10
        brightness: ${maxBright}%
        transition_length: ${transLenghtOn}s
    - delay: ${delayLenghtOn}s
    - light.turn_on:
        id: step11
        brightness: ${maxBright}%
        transition_length: ${transLenghtOn}s
    - delay: ${delayLenghtOn}s
    - light.turn_on:
        id: step12
        brightness: ${maxBright}%
        transition_length: ${transLenghtOn}s
    - delay: ${delayLenghtOn}s
    - light.turn_on:
        id: step13
        brightness: ${maxBright}%
        transition_length: ${transLenghtOn}s
    - delay: ${delayLenghtOn}s
    - light.turn_on:
        id: step14
        brightness: ${maxBright}%
        transition_length: ${transLenghtOn}s
    - delay: ${delayLenghtOn}s
    - light.turn_on:
