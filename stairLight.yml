button:
  # restart the controller from HA button  
  - platform: restart
    name: $upperDevicename Restart

  # Trigger bottom-top fade on
  - platform: template
    name: fadeOnBottomTop
    on_press:
      then:
        - script.execute: fadeOnBottomTop

  # Trigger bottom-top fade off
  - platform: template
    name: fadeOffBootomTop
    on_press:
      then:
        - script.execute: fadeOffBootomTop

# Trigger top-bottom fade on
  - platform: template
    name: fadeOnTopBottom
    on_press:
      then:
        - script.execute: fadeOnTopBottom

# Trigger top-bottom fade off
  - platform: template
    name: fadeOffTopBootom
    on_press:
      then:
        - script.execute: fadeOffTopBootom

sensor:
  - platform: uptime
    name: Uptime Sensor
    id: uptime_sensor
    update_interval: 60s
    internal: true
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? String(days) + "d " : "") +
                (hours ? String(hours) + "h " : "") +
                (minutes ? String(minutes) + "m " : "") +
                (String(seconds) + "s")
              ).c_str();
      
text_sensor:
  - platform: template
    name: $upperDevicename Uptime Human Readable
    id: uptime_human
    icon: mdi:clock-start

binary_sensor:
  - platform: template
    name: ledOn
    id: ledOn
    internal: True
