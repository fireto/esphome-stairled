    channel: 5
    inverted: False

  - platform: pca9685
    id: pca1_6
    channel: 6
    inverted: False

  - platform: pca9685
    id: pca1_7
    channel: 7
    inverted: False

  - platform: pca9685
    id: pca1_8
    channel: 8
    inverted: False

  - platform: pca9685
    id: pca1_9
    channel: 9
    inverted: False

  - platform: pca9685
    id: pca1_10
    channel: 10
    inverted: False

  - platform: pca9685
    id: pca1_11
    channel: 11
    inverted: False

  - platform: pca9685
    id: pca1_12
    channel: 12
    inverted: False

  - platform: pca9685
    id: pca1_13
    channel: 13
    inverted: False

  - platform: pca9685
    id: pca1_14
    channel: 14
    inverted: False

  - platform: pca9685
    id: pca1_15
    channel: 15
    inverted: False

